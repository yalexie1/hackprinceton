# Building Data Genome Project 2 — eval input manifest.
#
# The bytes are NOT committed: they land in data/cache/evals/bdg2/, which is
# git-ignored (AGENTS.md section 4). This file is what makes the download
# reproducible. Verify with:
#   sha256sum -c <(awk '/sha256:/{print $2"  "f} /path:/{f=$2}' bdg2.yaml)
#
# IMPORTANT: use the media.githubusercontent.com endpoint. The repo stores these
# files in git-lfs, so raw.githubusercontent.com returns a ~130-byte LFS pointer
# ("version https://git-lfs.github.com/spec/v1") instead of the CSV, and a reader
# fed that pointer fails with a confusing parse error rather than a 404.

dataset: Building Data Genome Project 2
repo: https://github.com/buds-lab/building-data-genome-project-2
archive: https://zenodo.org/records/3887306
retrieved: 2026-11-15
base_url: https://media.githubusercontent.com/media/buds-lab/building-data-genome-project-2/master/data

citation: >
  Miller, C., Kathirgamanathan, A., Picchetti, B. et al. The Building Data Genome
  Project 2, energy meter data from the ASHRAE Great Energy Predictor III
  competition. Scientific Data 7, 368 (2020). arXiv:2006.02273.

licence: >
  Open data released by the Building Data Genome Project consortium via the public
  GitHub repository and Zenodo deposit above. Verify the repository's current LICENSE
  before any redistribution; this project only reads the files locally and commits
  no part of them.

files:
  - path: data/cache/evals/bdg2/metadata.csv
    url: metadata/metadata.csv
    bytes: 272024
    sha256: 992d0b29f24f96ad4332bc4dbb534b7bdd7dd2689aad093f94e93068ecddca02
    used_for: >
      building_id, site_id, primaryspaceusage, sqm, yearbuilt, numberoffloors,
      lat, lng, timezone. Drives the sample and every adapter field.

  - path: data/cache/evals/bdg2/weather.csv
    url: weather/weather.csv
    bytes: 19457782
    sha256: a8189f1c6acdf3b9933a9e6354b8e7c1278cd56a7075929623a17565d44f04bd
    used_for: >
      airTemperature per site, the measured-temperature arm. Carries NO irradiance
      (columns are airTemperature, cloudCoverage, dewTemperature, precipDepth1HR,
      precipDepth6HR, seaLvlPressure, windDirection, windSpeed), which is why both
      arms take GHI/DNI/DHI from Open-Meteo.

  - path: data/cache/evals/bdg2/electricity_cleaned.csv
    url: meters/cleaned/electricity_cleaned.csv
    bytes: 174977911
    sha256: b6ffc9b4dfcefe5c753594730a08ae822b0d50fec6815abb8f185591e6c630a3
    used_for: >
      Ground truth. The project's own cleaned series, not meters/raw/, so the
      outlier handling is the dataset authors' and not ours.

  - path: data/cache/evals/bdg2/gas_cleaned.csv
    url: meters/cleaned/gas_cleaned.csv
    bytes: 22002654
    sha256: b3b059d32e8a16a92fb274e2e90483fac9b7797e42a9e07840ab9df130266405
    used_for: >
      Gas truth. Only 26 of the sampled buildings carry both electricity and gas,
      so any gas result is small-N and reported separately, never pooled.

secondary:
  - source: Open-Meteo archive API (archive-api.open-meteo.com/v1/archive)
    retrieved: 2026-11-15
    used_for: >
      Hourly GHI/DNI/DHI for all five sites in both arms, plus temperature in the
      openmeteo arm. Year 2017. Not checksummed: it is a live API, so prep_weather.py
      records the per-site degree-day summary in data/cache/evals/weather/
      weather_report.json as the reproducibility trace instead.

