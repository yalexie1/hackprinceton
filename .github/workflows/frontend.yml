name: Frontend compatibility

on:
  push:
    branches: [main, 1-frontend]
    paths: ['frontend/**', 'backend/**', 'specs/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'specs/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGENT_MODE: replay
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r frontend/scripts/integration-requirements.txt
      - run: npm test
        working-directory: frontend
      - run: npm run check:contract
        working-directory: frontend
      - run: python frontend/scripts/check_integration.py
      - run: npm run build
        working-directory: frontend
